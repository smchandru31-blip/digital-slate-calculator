; PlatformIO Project Configuration File for ESP32-2432S028 ("Cheap Yellow Display")
; Digital Slate Calculator - Diagnostic Firmware

[env:esp32-2432s028]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags = 
    -D BOARD_HAS_PSRAM=0

lib_deps =
    lovyan03/LovyanGFX @ ^1.1.16
